<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HichamGPT- Agentic AI Chatbot (HITL)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: #212121;
            color: #ececec;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: #171717;
            border-right: 1px solid #2f2f2f;
            display: flex;
            flex-direction: column;
            padding: 12px;
            color: #ececec;
        }

        .brand { font-size: 18px; font-weight: 700; padding: 12px; margin-bottom: 10px; }

        .new-chat {
            border: 1px solid #3f3f3f;
            background: transparent;
            color: #ececec;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .new-chat:hover { background: #2a2a2a; }

        .history-title { color: #999; font-size: 13px; margin: 10px 0; padding-left: 4px; }

        #conversationList { overflow-y: auto; flex: 1; }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            color: #cfcfcf;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover { background: #2a2a2a; }
        .history-item.active { background: #303030; color: #ffffff; }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #212121;
        }

        .topbar {
            height: 56px;
            border-bottom: 1px solid #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            color: #ececec;
        }

        .status { font-size: 13px; color: #9ca3af; font-weight: 400; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 180px;
        }

        .welcome {
            max-width: 760px;
            margin: 80px auto 0;
            text-align: center;
        }

        .welcome h1 { font-size: 32px; margin-bottom: 10px; font-weight: 650; }
        .welcome p { color: #9ca3af; font-size: 15px; }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 760px;
            margin: 30px auto;
        }

        .card {
            border: 1px solid #383838;
            border-radius: 14px;
            padding: 16px;
            color: #d1d5db;
            cursor: pointer;
            background: #2f2f2f;
        }

        .card:hover { background: #383838; }

        /* --- MESSAGES & AVATARS --- */

        .message-row {
            max-width: 820px;
            margin: 0 auto 20px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-row.user { justify-content: flex-end; }

        .message-row.user .user-bubble {
            background: #2f2f2f;
            border-radius: 18px;
            padding: 12px 18px;
            color: #ececec;
            font-size: 15px;
            line-height: 1.5;
            max-width: 80%;
        }

        .message-row.assistant .assistant-text {
            color: #ececec;
            font-size: 15px;
            line-height: 1.6;
            padding-top: 4px;
            width: 100%;
            white-space: pre-wrap;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .avatar-user { background: #6366f1; color: white; }
        .avatar-bot { background: #10b981; color: white; }
        .avatar-tool { background: #f97316; color: white; }

        /* --- TOOL ACCORDION STYLES --- */

        .tool-row { align-items: flex-start; }

        .tool-box {
            border: 1px solid #383838;
            border-radius: 10px;
            background: #171717;
            overflow: hidden;
            font-size: 14px;
            width: 100%;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            background: #2a2a2a;
            font-weight: 500;
            color: #d1d5db;
            transition: background 0.2s;
        }

        .tool-header:hover { background: #333333; }

        .tool-chevron {
            display: inline-block;
            font-size: 11px;
            transition: transform 0.2s ease;
            margin-right: 4px;
        }

        .tool-header.collapsed .tool-chevron { transform: rotate(-90deg); }

        .tool-content {
            padding: 12px 14px;
            border-top: 1px solid #383838;
            background: #171717;
            font-size: 13px;
            color: #d1d5db;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tool-output-text {
            margin: 6px 0 0;
            background: #0d0d0d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            color: #a7f3d0;
            max-height: 250px;
            overflow-y: auto;
        }

        /* --- HUMAN IN THE LOOP (HITL) STYLES --- */

        .hitl-box {
            border: 1px solid #f59e0b;
            background: #271e05;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0 20px 48px;
            max-width: 820px;
            color: #fef3c7;
        }

        .hitl-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 15px;
            color: #fbbf24;
            margin-bottom: 8px;
        }

        .hitl-body {
            font-size: 14px;
            line-height: 1.5;
            color: #fef3c7;
            margin-bottom: 14px;
        }

        .hitl-actions {
            display: flex;
            gap: 10px;
        }

        .hitl-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .hitl-btn-approve { background: #10b981; color: white; }
        .hitl-btn-approve:hover { background: #059669; }

        .hitl-btn-reject { background: #ef4444; color: white; }
        .hitl-btn-reject:hover { background: #dc2626; }

        .hitl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- INPUT AREA --- */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            background: linear-gradient(to top, #212121 80%, transparent);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .listening-indicator {
            font-size: 12px;
            color: #ef4444;
            margin-bottom: 6px;
            display: none;
            font-weight: 500;
        }

        .input-wrapper {
            width: 100%;
            max-width: 820px;
            background: #2f2f2f;
            border: 1px solid #383838;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: #ececec;
            font-size: 15px;
            min-height: 24px;
            max-height: 150px;
            padding: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .icon-btn:hover { color: #ffffff; background: #383838; }

        .mic-btn.active {
            background: #ef4444 !important;
            color: white !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .send-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #111827;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover { background: #e5e7eb; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .input-area { left: 0; }
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="brand">BappyGPT</div>
    <button class="new-chat" onclick="newChat()">+ New chat</button>
    <div class="history-title">Recent Chats</div>
    <div id="conversationList"></div>
</aside>

<main class="main">
    <div class="topbar">
        <div>Agentic AI Chatbot</div>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h1>How can I help you today?</h1>
            <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
        </div>

        <div class="cards" id="cards">
            <div class="card" onclick="usePrompt('Buy 10 shares of AAPL.')">Buy 10 shares of AAPL (HITL demo)</div>
            <div class="card" onclick="usePrompt('Search the web for latest AI agent news.')">Search latest web info</div>
            <div class="card" onclick="usePrompt('Summarize the document I uploaded.')">Summarize uploaded document</div>
            <div class="card" onclick="usePrompt('Calculate 125 * 48 / 6')">Use calculator tool</div>
        </div>
    </div>

    <div class="input-area">
        <div class="listening-indicator" id="listeningIndicator">🎙️ Listening... Speak now</div>
        <div class="input-wrapper">
            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
            <button class="icon-btn" title="Upload Document" onclick="document.getElementById('fileInput').click()">📎</button>

            <textarea id="messageInput" placeholder="Type here or use voice..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>

            <select id="modelSelect" style="border:none; background:transparent; color:#9ca3af; margin-right:4px; outline:none; cursor:pointer;">
                <option value="gemini-2.5-flash" style="background:#2f2f2f;">gemini-2.5-flash</option>
                <option value="gemini-2.5-pro" style="background:#2f2f2f;">gemini-2.5-pro</option>
            </select>

            <button class="icon-btn mic-btn" id="micBtn" title="Voice Input" onclick="toggleVoiceInput()">🎙️</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
        </div>
    </div>
</main>

<script>
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");

    let threadId = localStorage.getItem("thread_id") || crypto.randomUUID();
    localStorage.setItem("thread_id", threadId);

    let activeToolsMap = {};
    let currentAssistantTextNode = null;
    let recognition = null;
    let isListening = false;

    function hideWelcome() {
        const welcome = document.getElementById("welcome");
        const cards = document.getElementById("cards");
        if (welcome) welcome.style.display = "none";
        if (cards) cards.style.display = "none";
    }

    function autoResize(ta) {
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + "px";
    }

    function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function usePrompt(txt) {
        messageInput.value = txt;
        autoResize(messageInput);
        messageInput.focus();
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addUserMessage(content) {
        hideWelcome();
        const row = document.createElement("div");
        row.className = "message-row user";
        row.innerHTML = `<div class="user-bubble">${escapeHtml(content)}</div>`;
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function startAssistantMessage() {
        hideWelcome();
        const row = document.createElement("div");
        row.className = "message-row assistant";
        const avatar = document.createElement("div");
        avatar.className = "avatar avatar-bot";
        avatar.innerText = "🤖";
        const textDiv = document.createElement("div");
        textDiv.className = "assistant-text";

        row.appendChild(avatar);
        row.appendChild(textDiv);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return textDiv;
    }

    /* --- GESTION DES OUTILS & PLIAGE/DÉPLIAGE --- */

    function toggleTool(headerEl) {
        const box = headerEl.closest(".tool-box");
        const content = box.querySelector(".tool-content");
        
        if (content.style.display === "none") {
            content.style.display = "block";
            headerEl.classList.remove("collapsed");
        } else {
            content.style.display = "none";
            headerEl.classList.add("collapsed");
        }
    }

    function renderToolStart(toolName) {
        hideWelcome();
        const row = document.createElement("div");
        row.className = "message-row tool-row";
        row.innerHTML = `
            <div class="avatar avatar-tool">🤖</div>
            <div class="tool-box">
                <div class="tool-header" onclick="toggleTool(this)">
                    <span class="tool-chevron">▼</span>
                    <span>⚙️ Running tool: <strong style="color:#10b981;">${escapeHtml(toolName)}</strong>...</span>
                </div>
                <div class="tool-content" style="display: block;">
                    <em>Executing action...</em>
                </div>
            </div>
        `;
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        activeToolsMap[toolName] = row.querySelector(".tool-box");
    }

    function renderToolEnd(toolName, result) {
        let box = activeToolsMap[toolName];

        // Fallback: Si la référence n'existe plus en mémoire JS, cherche le dernier bloc "Running tool"
        if (!box) {
            const allBoxes = document.querySelectorAll(".tool-box");
            for (let i = allBoxes.length - 1; i >= 0; i--) {
                const header = allBoxes[i].querySelector(".tool-header");
                if (header && (header.textContent.includes("Running tool") || header.textContent.includes("Awaiting"))) {
                    box = allBoxes[i];
                    break;
                }
            }
        }

        if (box) {
            const header = box.querySelector(".tool-header");
            const content = box.querySelector(".tool-content");

            if (header) {
                header.className = "tool-header collapsed";
                header.innerHTML = `
                    <span class="tool-chevron">▼</span>
                    <span>✅ Tool finished</span>
                `;
            }

            if (content) {
                content.style.display = "none";
                content.innerHTML = `<strong>Output:</strong><pre class="tool-output-text">${escapeHtml(result)}</pre>`;
            }
        }

        delete activeToolsMap[toolName];
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /* --- HUMAN-IN-THE-LOOP (HITL) CARD --- */

    function renderHITLApprovalCard(message) {
        hideWelcome();
        
        // 1. Fermer/Nettoyer les blocs d'outils restés en cours d'exécution
        const allBoxes = document.querySelectorAll(".tool-box");
        allBoxes.forEach(box => {
            const header = box.querySelector(".tool-header");
            if (header && header.textContent.includes("Running tool")) {
                header.className = "tool-header collapsed";
                header.innerHTML = `<span class="tool-chevron">▼</span><span>⏸️ Action interrupted - Awaiting confirmation</span>`;
                const content = box.querySelector(".tool-content");
                if (content) content.style.display = "none";
            }
        });

        // 2. Création de la carte de validation HITL
        const card = document.createElement("div");
        card.className = "hitl-box";
        card.id = "activeHITLCard";
        card.innerHTML = `
            <div class="hitl-header">⚠️ Human Approval Required</div>
            <div class="hitl-body">${escapeHtml(message || "An action requires your confirmation to proceed.")}</div>
            <div class="hitl-actions">
                <button class="hitl-btn hitl-btn-approve" onclick="handleHITLDecision('Yes, proceed')">✅ Approve</button>
                <button class="hitl-btn hitl-btn-reject" onclick="handleHITLDecision('No, cancel action')">❌ Decline</button>
            </div>
        `;
        chatContainer.appendChild(card);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleHITLDecision(decisionText) {
        const card = document.getElementById("activeHITLCard");
        if (card) {
            const buttons = card.querySelectorAll("button");
            buttons.forEach(b => b.disabled = true);
            card.style.opacity = "0.7";
        }
        sendDirectMessage(decisionText);
    }

    /* --- UPLOAD DE FICHIER --- */

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        if (!fileInput.files || fileInput.files.length === 0) return;

        const file = fileInput.files[0];
        hideWelcome();

        const userRow = document.createElement("div");
        userRow.className = "message-row user";
        userRow.innerHTML = `<div class="user-bubble">📎 Uploaded document: <strong>${escapeHtml(file.name)}</strong></div>`;
        chatContainer.appendChild(userRow);

        statusText.textContent = "Uploading & Indexing...";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("thread_id", threadId);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                const assistantRow = document.createElement("div");
                assistantRow.className = "message-row assistant";
                assistantRow.innerHTML = `
                    <div class="avatar avatar-bot">🤖</div>
                    <div class="assistant-text">
                        <div class="ingestion-badge">✓ Document Ingestion completed</div><br>
                        Le document <strong>${escapeHtml(file.name)}</strong> a été indexé avec succès. Posez-moi vos questions dessus !
                    </div>
                `;
                chatContainer.appendChild(assistantRow);
            } else {
                showUploadError(data.message || "Erreur de chargement du fichier.");
            }
        } catch (err) {
            showUploadError("Erreur réseau / serveur: " + err.message);
        } finally {
            statusText.textContent = "Ready";
            fileInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }

    function showUploadError(errMsg) {
        const assistantRow = document.createElement("div");
        assistantRow.className = "message-row assistant";
        assistantRow.innerHTML = `
            <div class="avatar avatar-bot">🤖</div>
            <div class="assistant-text" style="color: #f87171;">
                <strong>Upload failed:</strong> ${escapeHtml(errMsg)}
            </div>
        `;
        chatContainer.appendChild(assistantRow);
    }

    /* --- RECONNAISSANCE VOCALE --- */

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Votre navigateur ne supporte pas la reconnaissance vocale.");
            return null;
        }

        const rec = new SpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'en-US';

        rec.onstart = () => {
            isListening = true;
            updateMicUI(true);
        };

        rec.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            messageInput.value = transcript;
            autoResize(messageInput);
            document.getElementById("listeningIndicator").textContent = "Listening: " + transcript;
        };

        rec.onerror = (event) => {
            console.error("Speech error:", event.error);
            stopListening();
        };

        rec.onend = () => { stopListening(); };
        return rec;
    }

    function toggleVoiceInput() {
        if (!recognition) recognition = initSpeechRecognition();
        if (!recognition) return;

        if (isListening) {
            stopListening();
        } else {
            try { recognition.start(); } catch (e) {}
        }
    }

    function stopListening() {
        isListening = false;
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        updateMicUI(false);
    }

    function updateMicUI(listening) {
        const micBtn = document.getElementById("micBtn");
        const indicator = document.getElementById("listeningIndicator");
        if (listening) {
            micBtn.classList.add("active");
            indicator.style.display = "block";
        } else {
            micBtn.classList.remove("active");
            indicator.style.display = "none";
        }
    }

    /* --- ENVOI DE MESSAGES --- */

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        messageInput.value = "";
        autoResize(messageInput);
        sendDirectMessage(text);
    }

    async function sendDirectMessage(text) {
        if (isListening) stopListening();

        addUserMessage(text);
        statusText.textContent = "Thinking...";

        currentAssistantTextNode = null;
        activeToolsMap = {};

        try {
            const res = await fetch("/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: text,
                    thread_id: threadId,
                    model: document.getElementById("modelSelect").value
                })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n\n");
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const payload = JSON.parse(line.replace("data: ", ""));

                        if (payload.type === "tool_start") {
                            renderToolStart(payload.tool);
                        } else if (payload.type === "tool_end") {
                            renderToolEnd(payload.tool, payload.result);
                        } else if (payload.type === "interrupt") {
                            renderHITLApprovalCard(payload.message);
                        } else if (payload.type === "token") {
                            if (!currentAssistantTextNode) {
                                currentAssistantTextNode = startAssistantMessage();
                            }
                            currentAssistantTextNode.textContent += payload.token;
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }
                }
            }
        } catch (err) {
            console.error(err);
        } finally {
            statusText.textContent = "Ready";
            loadConversations();
        }
    }

    async function loadConversations() {
        try {
            const res = await fetch("/conversations");
            const data = await res.json();
            conversationList.innerHTML = "";
            (data.conversations || []).forEach(conv => {
                const item = document.createElement("div");
                item.className = "history-item" + (conv.thread_id === threadId ? " active" : "");
                item.textContent = conv.title || "Chat";
                item.onclick = () => loadConversation(conv.thread_id);
                conversationList.appendChild(item);
            });
        } catch (e) {}
    }

    async function loadConversation(id) {
        threadId = id;
        localStorage.setItem("thread_id", threadId);
        const res = await fetch(`/history/${threadId}`);
        const data = await res.json();
        chatContainer.innerHTML = "";

        if (!data.messages || data.messages.length === 0) {
            newChat();
            return;
        }

        data.messages.forEach(m => {
            if (m.role === "user") addUserMessage(m.content);
            else {
                const t = startAssistantMessage();
                t.textContent = m.content;
            }
        });
        loadConversations();
    }

    function newChat() {
        threadId = crypto.randomUUID();
        localStorage.setItem("thread_id", threadId);
        chatContainer.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
            </div>
        `;
        loadConversations();
    }

    loadConversations();
    if (threadId) loadConversation(threadId);
</script>
</body>
</html>
